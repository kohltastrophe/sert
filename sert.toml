# sert's own configuration: the toolkit tests itself with its own CLI (PYTHONPATH=python python3 -m sert ...).

[test]
specs = ["test/*.spec.luau"]
codegen = false

[coverage]
include = ["src"]
min = 90

[mutate]
include = ["src"]
timeout = 0.5

[mutate.specs]
"src/core/assert.luau" = "@file=Assert"
"src/core/bytes.luau" = "@file=Format,Sert"
"src/core/format.luau" = "@file=Format"
"src/core/match.luau" = "@file=Assert"
"src/core/registry.luau" = "@file=Runner"
"src/core/rng.luau" = "@file=Gen,Runner,Sert"
"src/core/runner.luau" = "@file=Runner"
"src/core/spy.luau" = "@file=Assert,Sert"
"src/core/util.luau" = "@file=Assert,Format,Runner"
"src/engine" = "@file=Engine,Env"
"src/env" = "@file=Env"
"src/init.luau" = "@file=Sert"
"src/prop/gen.luau" = "@file=Gen"
"src/prop/init.luau" = "@file=Gen,Laws,Model,Runner"
"src/prop/laws.luau" = "@file=Laws"
"src/prop/model.luau" = "@file=Model"
"src/roblox/Layout.luau" = "@file=Roblox,layout_headless"
"src/roblox" = "@file=Roblox"
"src/sim" = "@file=Sim"

# Compile-time probes of the public types (run by `sert lint` or `sert lint --only types`): pass files analyze clean,
# fail files error on exactly their `-- expect-error` lines, under both solvers.
[types]
pass = ["test/types"]
fail = ["test/types/fail"]

[studio]
project = "test/roblox/default.project.json"
specs = ["test/roblox/specs/**/*.spec.luau"]

[lint]
paths = ["src", "test"]
project = "test/roblox/default.project.json"
solvers = ["new", "old"]
selene = true
stub = false

[release]
prefix = "v"
versions = [
	{ file = "python/sert/__init__.py", pattern = '^VERSION = "([^"]+)"$' },
	{ file = "actions/setup/action.yml", pattern = '^\s*SERT_ACTION_VERSION: "([^"]+)"' },
	{ file = "actions/setup/action.yml", pattern = '^#.*uses: kohltastrophe/sert/actions/setup@v([^\s`")]+)' },
	{ file = "README.md", pattern = 'sert/v([^\s`")]+)/tools/sert\.py' },
	{ file = "README.md", pattern = 'actions/setup@v([^\s`")]+)' },
	{ file = "docs/ci.md", pattern = 'actions/setup@v([^\s`")]+)' },
	{ file = "docs/cli.md", pattern = '`version = "([^"]+)"`' },
]
