name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: python
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  check:
    name: Lint, Test, Coverage & Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits and version check
        uses: kohltastrophe/release@v1
        with:
          mode: check

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Fetch tools and types
        run: |
          python3 -m sert fetch
          echo "${{ github.workspace }}/.sert/bin" >> "$GITHUB_PATH"

      - name: sert lint
        run: |
          python3 -m sert lint
          python3 scripts/gen_api.py --check

      - name: Python tests
        run: python3 -m unittest discover -v python/tests

      - name: sert run
        run: python3 -m sert run --coverage --junit sert-junit.xml

      - name: sert coverage
        run: python3 -m sert coverage --badge

      - name: sert mutate
        if: "!startsWith(github.event.head_commit.message || github.event.pull_request.title, 'chore: release')"
        run: python3 -m sert mutate --no-coverage-run

      - name: lute suite
        run: lute run test/run.luau

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error
          overwrite: true

  badge:
    name: Update Coverage Badge
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge

      - name: Commit coverage.json onto badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent=""
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --no-tags origin refs/heads/badges:refs/heads/badges
            parent="-p refs/heads/badges"
          fi
          blob=$(git hash-object -w coverage.json)
          tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
          if [ -z "$parent" ] || [ "$(git rev-parse refs/heads/badges^{tree})" != "$tree" ]; then
            msg=$(python3 -c 'import json; print("badge: coverage " + json.load(open("coverage.json"))["message"])')
            commit=$(git commit-tree "$tree" $parent -m "$msg")
            git push origin "$commit:refs/heads/badges"
          fi
