name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only; no GitHub release
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: python

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1.0.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          wait-for-ci: ci.yml

      - name: Pack release
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          VERSION="${VERSION:-$(python3 -c 'import sert; print(sert.VERSION)')}"
          python3 -m sert release pack --out dist/
          python3 -m sert release pack --out "$RUNNER_TEMP/again/"
          for f in "sert-$VERSION.zip" "sert-$VERSION.pyz"; do
            [ -f "dist/$f" ] || { echo "::error::pack did not write $f"; exit 1; }
            cmp "dist/$f" "$RUNNER_TEMP/again/$f" || { echo "::error::$f is not reproducible"; exit 1; }
          done
          (
            cd dist
            [ -f SHA256SUMS ] || sha256sum "sert-$VERSION.zip" "sert-$VERSION.pyz" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
            python3 "sert-$VERSION.pyz" --help > /dev/null
            { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          )

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          sha256sum --check --strict SHA256SUMS
          assets=("sert-$VERSION.zip" "sert-$VERSION.pyz" SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            git push --force origin "$GITHUB_SHA:refs/tags/$TAG"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "sert $VERSION" --notes-file "$NOTES_FILE"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            if [ "$PRERELEASE" = true ]; then
              gh release create "$TAG" "${assets[@]}" --title "sert $VERSION" --notes-file "$NOTES_FILE" --prerelease
            else
              gh release create "$TAG" "${assets[@]}" --title "sert $VERSION" --notes-file "$NOTES_FILE"
            fi
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "sert $VERSION" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "sert $VERSION" --notes-file "$NOTES_FILE"
          fi
