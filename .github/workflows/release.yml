name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only; no GitHub release
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: python

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1
        with:
          wait-for-ci: ci.yml

      - name: Pack release
        if: steps.release.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 scripts/pack.py --out dist/
          python3 scripts/pack.py --out "$RUNNER_TEMP/again/"
          for f in "sert-$VERSION.zip" "sert-$VERSION.pyz"; do
            [ -f "dist/$f" ] || { echo "::error::pack did not write $f"; exit 1; }
            cmp "dist/$f" "$RUNNER_TEMP/again/$f" || { echo "::error::$f is not reproducible"; exit 1; }
          done
          (
            cd dist
            [ -f SHA256SUMS ] || sha256sum "sert-$VERSION.zip" "sert-$VERSION.pyz" > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
            python3 "sert-$VERSION.pyz" --help > /dev/null
          )

      - name: Create GitHub release
        if: steps.release.outputs.should_build == 'true'
        uses: kohltastrophe/release@v1
        with:
          mode: publish
          title: sert {version}
          files: |
            dist/sert-{version}.zip
            dist/sert-{version}.pyz
            dist/SHA256SUMS
